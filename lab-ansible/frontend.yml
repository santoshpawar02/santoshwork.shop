- name: Frontend Setup
  hosts: all
  become: true
  tasks:
    - name: Disabling Nginx
      ansible.builtin.shell:
        cmd: dnf module disable nginx -y
    - name: Enabling Nginx
      ansible.builtin.shell:
        cmd: dnf module enable nginx:1.24 -y
    - name: Installing Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present
    - name: reStart Nginx service
      ansible.builtin.service:
      name: nginx
      state: restarted
